<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#ea580c" />
<title>GRUPO SINERGYS — Superagente Comercial Multimarca con IA</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
:root{--brand:#ea580c;--brand-2:#f97316;--brand-dark:#c2410c;--brand-light:#fff7ed;--bg:#f4f6fb;--card:#fff;--text:#1a2236;--muted:#6b7280;--border:#e5e7eb;--ok:#16a34a;--warn:#f59e0b;--danger:#dc2626;--info:#2563eb;--shadow:0 4px 14px rgba(234,88,12,.08);--radius:14px;--radius-sm:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#ea580c 0%,#f97316 100%)}
.login-card{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.brand-logo{display:flex;flex-direction:column;align-items:center;margin-bottom:24px}
.brand-logo .logo-mark{width:64px;height:64px;margin-bottom:12px}
.brand-logo .logo-mark svg{width:100%;height:100%}
.brand-logo h1{margin:0;font-size:20px;color:var(--brand);text-align:center}
.brand-logo p{margin:4px 0 0;color:var(--muted);font-size:13px;text-align:center}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:#374151}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(234,88,12,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:transform .05s,background .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:#fff;width:100%}
.btn-primary:hover{background:var(--brand-2)}
.btn-secondary{background:#f3f4f6;color:var(--text)}
.btn-accent{background:var(--brand);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-sm{padding:8px 12px;font-size:13px}
.login-demo{margin-top:14px;text-align:center;font-size:13px;color:var(--muted)}
.login-demo button{color:var(--brand);font-weight:600;text-decoration:underline}
.login-error{background:#fee2e2;color:#991b1b;padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.login-reset{text-align:center;margin-top:10px}
.login-reset button{font-size:12px;color:var(--muted);text-decoration:underline}
.app{display:none;min-height:100vh}
.app.active{display:block}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px}
.topbar .brand-mini{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.topbar .brand-mini .mark{width:34px;height:34px;flex-shrink:0}
.topbar .brand-mini .mark svg{width:100%;height:100%}
.topbar .brand-mini .txt .n{font-weight:700;font-size:14px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand-mini .txt .s{font-size:11px;color:var(--muted)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f3f4f6;font-size:18px}
.search-global{flex:1;position:relative;max-width:500px}
.search-global input{width:100%;padding:10px 14px 10px 38px;border-radius:10px;border:1px solid var(--border);background:#f9fafb}
.search-global .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-results{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:60}
.search-results .sr-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:10px;align-items:center}
.search-results .sr-item:hover{background:#f9fafb}
.sr-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--brand-light);color:var(--brand);font-weight:600;text-transform:uppercase}
.main{padding:14px;padding-bottom:90px;max-width:1300px;margin:0 auto}
.page-title{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px;flex-wrap:wrap;gap:10px}
.page-title h2{margin:0;font-size:22px}
.page-title .sub{color:var(--muted);font-size:13px;margin-top:2px}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-5{grid-template-columns:repeat(5,1fr)}
@media(max-width:900px){.grid-4,.grid-5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font-size:24px;font-weight:800;color:var(--brand)}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat.ok .v{color:var(--ok)}.stat.warn .v{color:var(--warn)}.stat.danger .v{color:var(--danger)}.stat.info .v{color:var(--info)}
.hoy-hero{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:14px}
.hoy-hero h2{margin:0 0 4px;font-size:22px}
.hoy-hero .total{font-size:44px;font-weight:800;line-height:1;margin:10px 0}
.hoy-hero .sub{opacity:.9;font-size:14px}
.hoy-hero .btn-ai{margin-top:12px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3)}
.hoy-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:#fff;border-radius:var(--radius-sm);padding:14px;border-left:4px solid var(--brand);cursor:pointer;transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile .n{font-size:22px;font-weight:800}
.tile .l{font-size:11px;color:var(--muted);margin-top:2px}
.tile.red{border-left-color:var(--danger)}.tile.red .n{color:var(--danger)}
.tile.orange{border-left-color:#f97316}.tile.orange .n{color:#f97316}
.tile.yellow{border-left-color:var(--warn)}.tile.yellow .n{color:var(--warn)}
.tile.blue{border-left-color:var(--info)}.tile.blue .n{color:var(--info)}
.tile.green{border-left-color:var(--ok)}.tile.green .n{color:var(--ok)}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:border-color .15s}
.list-item:hover{border-color:var(--brand)}
.list-item .li-main{flex:1;min-width:0}
.list-item .li-title{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list-item .li-sub{font-size:13px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--brand-light);color:var(--brand)}
.badge.ok{background:#dcfce7;color:#166534}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.danger{background:#fee2e2;color:#991b1b}
.badge.info{background:#dbeafe;color:#1e40af}
.badge.muted{background:#f3f4f6;color:#6b7280}
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
@media(min-width:760px){.modal-back{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:820px;max-height:92vh;border-radius:18px 18px 0 0;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:760px){.modal{border-radius:18px}}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:16px 18px;overflow:auto;flex:1}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:#f9fafb;flex-wrap:wrap}
.close-x{width:34px;height:34px;border-radius:10px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;background:#f3f4f6;font-size:13px;font-weight:600;white-space:nowrap;color:#374151}
.tab.active{background:var(--brand);color:#fff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 4px;z-index:40}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--muted);font-size:10px;font-weight:600}
.bn-item .ic{font-size:20px}
.bn-item.active{color:var(--brand)}
@media(min-width:900px){.bottom-nav{display:none}}
.layout{display:flex;min-height:100vh}
.sidebar{display:none;width:260px;background:#fff;border-right:1px solid var(--border);padding:16px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
@media(min-width:900px){.sidebar{display:block}}
.side-brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.side-brand .mark{width:38px;height:38px;flex-shrink:0}
.side-brand .mark svg{width:100%;height:100%}
.side-brand .n{font-weight:700;color:var(--brand);font-size:14px}
.side-brand .s{font-size:10px;color:var(--muted)}
.side-sep{font-size:11px;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px;letter-spacing:.5px;font-weight:700}
.side-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#374151;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:2px}
.side-item:hover{background:#f3f4f6}
.side-item.active{background:var(--brand);color:#fff}
.side-item .ic{font-size:18px;width:22px;text-align:center}
.content{flex:1;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:12px}
.text-muted{color:var(--muted);font-size:13px}
.divider{height:1px;background:var(--border);margin:12px 0}
.empty{padding:30px 20px;text-align:center;color:var(--muted)}
.empty .ic{font-size:42px;margin-bottom:8px;opacity:.5}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:600;color:#374151}
.chip.red{background:#fee2e2;color:#991b1b}.chip.orange{background:#ffedd5;color:#9a3412}
.chip.yellow{background:#fef3c7;color:#92400e}.chip.blue{background:#dbeafe;color:#1e40af}
.chip.green{background:#dcfce7;color:#166534}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.two-col{grid-template-columns:1fr}}
.alert-banner{background:#fef3c7;border:1px solid #fcd34d;color:#92400e;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fadein .2s}
@keyframes fadein{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:14px;gap:10px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex-shrink:0}
.kv .v{font-weight:600;text-align:right}
details{background:#f9fafb;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.sector-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .15s;display:flex;gap:12px;align-items:center}
.sector-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
.sector-card .sec-icon{font-size:32px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,var(--brand-light),#fed7aa)}
.sector-card .sec-info{flex:1;min-width:0}
.sector-card .sec-name{font-weight:700;font-size:15px}
.sector-card .sec-count{font-size:12px;color:var(--muted)}
.matrix-table{width:100%;border-collapse:collapse;font-size:12px}
.matrix-table th,.matrix-table td{padding:8px;text-align:center;border:1px solid var(--border)}
.matrix-table th{background:var(--brand);color:#fff;font-size:11px}
.matrix-cell{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.matrix-cell.has{background:#dcfce7;color:#166534}
.matrix-cell.no{background:#f3f4f6;color:#d1d5db}
.chat{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:400px}
.chat-msgs{flex:1;overflow:auto;padding:10px 0;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#f3f4f6;border-bottom-left-radius:4px}
.chat-input{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.chat-input input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#f9fafb}
.mic-btn{width:46px;height:46px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.mic-btn.recording{background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.invoice-preview{background:#fff;border:2px solid var(--border);border-radius:12px;padding:24px;font-size:13px}
.invoice-preview .inv-head{display:flex;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:3px solid var(--brand)}
.invoice-preview table{width:100%;border-collapse:collapse;margin:12px 0}
.invoice-preview th{background:var(--brand);color:#fff;padding:8px;text-align:left;font-size:12px}
.invoice-preview td{padding:8px;border-bottom:1px solid var(--border)}
.invoice-preview .totals{margin-top:16px;display:flex;justify-content:flex-end}
.invoice-preview .totals table{width:280px}
.invoice-preview .totals tr.total-final td{background:var(--brand);color:#fff;font-weight:700}
.line-item{background:#f9fafb;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:2fr 80px 100px 100px 30px;gap:6px;align-items:center}
@media(max-width:600px){.line-item{grid-template-columns:1fr}}
.line-item input{padding:8px;font-size:13px}
.line-item .remove{background:var(--danger);color:#fff;border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.import-step{display:none}
.import-step.active{display:block}
.import-steps-nav{display:flex;gap:8px;margin-bottom:16px}
.import-steps-nav .step{flex:1;padding:10px;background:#f3f4f6;border-radius:10px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);border:2px solid transparent}
.import-steps-nav .step.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.import-steps-nav .step.done{background:#dcfce7;color:#166534;border-color:var(--ok)}
.import-preview{max-height:400px;overflow:auto;border:1px solid var(--border);border-radius:10px;margin:12px 0}
.import-preview table{width:100%;border-collapse:collapse;font-size:12px}
.import-preview th{background:var(--brand);color:#fff;padding:8px;text-align:left;position:sticky;top:0}
.import-preview td{padding:6px 8px;border-bottom:1px solid var(--border)}
.import-preview tr.dup{background:#fef3c7}
.import-preview tr.err{background:#fee2e2}
.import-preview tr.ok{background:#f0fdf4}
.import-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media(max-width:600px){.import-stats{grid-template-columns:repeat(2,1fr)}}
.import-stats .box{padding:12px;border-radius:10px;text-align:center}
.import-stats .box .n{font-size:22px;font-weight:800}
.import-stats .box .l{font-size:11px;text-transform:uppercase;margin-top:2px}
.import-stats .ok{background:#dcfce7;color:#166534}
.import-stats .warn{background:#fef3c7;color:#92400e}
.import-stats .err{background:#fee2e2;color:#991b1b}
.import-stats .info{background:#dbeafe;color:#1e40af}
.column-mapper{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
@media(max-width:500px){.column-mapper{grid-template-columns:1fr}}
.column-mapper .cm-item{background:#f9fafb;padding:10px;border-radius:8px;border:1px solid var(--border)}
.column-mapper .cm-item label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.column-mapper .cm-item select{width:100%;padding:6px;font-size:13px}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop-zone:hover,.drop-zone.drag{border-color:var(--brand);background:var(--brand-light)}
.drop-zone .ic{font-size:48px;margin-bottom:8px}
.drop-zone .t{font-weight:600;font-size:15px}
.drop-zone .s{color:var(--muted);font-size:13px;margin-top:4px}
.chart-box{width:100%;height:180px}
.admin-mode-banner{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13px}
.admin-mode-banner .ic{font-size:22px}
.role-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600;background:var(--brand-light);color:var(--brand);margin-left:6px}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <path d="M40 100 L80 60 L120 100 L160 60 L180 80 L140 120 L100 80 L60 120 Z" fill="#f5f0e8" stroke="#3d4a7a" stroke-width="8" stroke-linejoin="round"/>
          <path d="M60 120 L100 160 L140 120" fill="none" stroke="#3d4a7a" stroke-width="8" stroke-linecap="round"/>
          <path d="M80 100 L100 120 L120 100" fill="none" stroke="#3d4a7a" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>GRUPO SINERGYS</h1>
      <p>Superagente Comercial Multimarca con IA</p>
    </div>
    <div id="loginError" class="login-error hidden"></div>
    <form id="loginForm">
      <div class="form-group"><label>Usuario o email</label><input type="text" id="loginUser" required /></div>
      <div class="form-group"><label>Contraseña</label><input type="password" id="loginPass" required /></div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <div class="login-demo">¿No tienes cuenta? <button id="btnDemoAccess">Entrar en modo DEMO</button></div>
    <div class="login-reset"><button id="btnEmergencyReset">🔧 Reset de emergencia</button></div>
    <div class="text-muted" style="text-align:center;margin-top:14px;font-size:11px">v3.1 · 14 sectores · 7 roles · Territorios</div>
  </div>
</div>

<div id="app" class="app">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="content">
      <div class="topbar">
        <div class="brand-mini">

function enableDemo(db){
  db.demoSnapshot = {
    users:db.users.filter(u=>!u.isDemo),
    clients:db.clients.filter(c=>!c.isDemo),
    contracts:db.contracts.filter(c=>!c.isDemo),
    tasks:db.tasks.filter(t=>!t.isDemo),
    commissions:db.commissions.filter(c=>!c.isDemo),
    opportunities:db.opportunities.filter(o=>!o.isDemo),
    companies:db.companies.filter(c=>!c.isDemo),
    documents:db.documents.filter(d=>!d.isDemo),
    invoices:db.invoices.filter(i=>!i.isDemo)
  };
  const seed = seedDemo();
  seed.companies.forEach(c=>{c.isDemo=true;db.companies.push(c)});
  seed.demoUser.isDemo = true;
  if(!db.users.find(u=>u.username==="demo")) db.users.push(seed.demoUser);
  seed.clients.forEach(c=>{c.isDemo=true;db.clients.push(c)});
  seed.contracts.forEach(c=>{c.isDemo=true;db.contracts.push(c)});
  seed.tasks.forEach(t=>{t.isDemo=true;db.tasks.push(t)});
  seed.commissions.forEach(c=>{c.isDemo=true;db.commissions.push(c)});
  seed.opportunities.forEach(o=>{o.isDemo=true;db.opportunities.push(o)});
  seed.invoices.forEach(i=>{i.isDemo=true;db.invoices.push(i)});
  db.settings.demo = true;
  DB.save(db);
}

function disableDemo(db){
  if(db.demoSnapshot){
    db.users=db.demoSnapshot.users;db.clients=db.demoSnapshot.clients;
    db.contracts=db.demoSnapshot.contracts;db.tasks=db.demoSnapshot.tasks;
    db.commissions=db.demoSnapshot.commissions;db.opportunities=db.demoSnapshot.opportunities;
    db.companies=db.demoSnapshot.companies;db.documents=db.demoSnapshot.documents;
    db.invoices=db.demoSnapshot.invoices;
  } else {
    ['users','clients','contracts','tasks','commissions','opportunities','companies','documents','invoices'].forEach(k=>{
      db[k]=(db[k]||[]).filter(x=>!x.isDemo);
    });
  }
  db.settings.demo=false;db.demoSnapshot=null;DB.save(db);
}

// CORRECCIÓN #4: filtro mejorado para director_territorial
function my(scope){
  if(!session) return [];
  const uid = getActiveUserId();
  if(canViewAll()) return db[scope]||[];
  
  const user = db.users.find(u=>u.id===uid);
  if(!user) return [];
  
  if(user.role==="director_territorial"){
    const provinces = user.territory?.provinces || [];
    const commercialIds = db.users
      .filter(u=>u.role==="comercial" && (provinces.includes(u.province) || (u.territory && u.territory.provinces && u.territory.provinces.some(p=>provinces.includes(p)))))
      .map(u=>u.id);
    return (db[scope]||[]).filter(x=>x.userId===uid || commercialIds.includes(x.userId));
  }
  
  if(user.role==="backoffice") return [];
  
  return (db[scope]||[]).filter(x=>x.userId===uid);
}

function renewalBucket(days){
  if(days<0) return {label:"Vencido",chip:"red"};
  if(days<=15) return {label:"0-15 días",chip:"red"};
  if(days<=30) return {label:"16-30 días",chip:"orange"};
  if(days<=45) return {label:"31-45 días",chip:"yellow"};
  if(days<=60) return {label:"46-60 días",chip:"blue"};
  return {label:"+60 días",chip:"green"};
}
function computeRenewals(){
  return myContracts().map(c=>{
    const days = daysBetween(todayISO(),c.renewalDate);
    return {...c,daysToRenewal:days,bucket:renewalBucket(days)};
  }).sort((a,b)=>a.daysToRenewal-b.daysToRenewal);
}
function dormantClients(){
  const today = todayISO();
  return myClients().map(c=>{
    const days = daysBetween(c.lastContact||c.createdAt,today);
    const contracts = myContracts().filter(x=>x.clientId===c.id);
    let bucket="activo";
    if(days>=365) bucket="12m";
    else if(days>=180) bucket="6m";
    else if(days>=90) bucket="3m";
    return {...c,daysSinceContact:days,contracts,bucket};
  }).filter(c=>c.bucket!=="activo").sort((a,b)=>b.daysSinceContact-a.daysSinceContact);
}

function prepararLlamada(clientId){
  const c=clientById(clientId);if(!c) return;
  const contracts=myContracts().filter(x=>x.clientId===clientId);
  const bySector = {};
  contracts.forEach(co=>{if(!bySector[co.sector])bySector[co.sector]=[];bySector[co.sector].push(co)});
  let resumen = ` CLIENTE: ${c.name} ${c.surname||""}\n📞 ${c.phone||"—"} · ✉️ ${c.email||"—"}\n📅 Último contacto: ${fmtDate(c.lastContact)}\n\n`;
  resumen += `📊 SERVICIOS CONTRATADOS (${contracts.length}):\n`;
  Object.entries(bySector).forEach(([sid,list])=>{
    const s = SECTORS[sid];
    resumen += `\n${s.icon} ${s.name}:\n`;
    list.forEach(co=>{ resumen += `  • ${co.companyName} — ${renderContractSummary(co)}\n`; });
  });
  const missingSectors = Object.keys(SECTORS).filter(s=>!bySector[s]);
  const rec = [];
  if(missingSectors.length) rec.push(`• Venta cruzada: el cliente no tiene ${missingSectors.slice(0,3).map(s=>SECTORS[s].name).join(", ")}. Ofrecer.`);
  const urgentes = contracts.filter(co=>daysBetween(todayISO(),co.renewalDate)<=30);
  if(urgentes.length) rec.push("• Renovaciones próximas: confirmar continuidad.");
  if(c.lastContact&&daysBetween(c.lastContact,todayISO())>90) rec.push("• Hace tiempo sin contacto: empezar preguntando cómo le ha ido.");
  if(!rec.length) rec.push("• Llamada de seguimiento general.");
  openModal(" Preparar llamada — "+c.name,
    `<div style="white-space:pre-wrap;font-size:13px;line-height:1.55;background:#f9fafb;padding:12px;border-radius:10px;border:1px solid var(--border)">${esc(resumen)}</div>
     <div class="divider"></div>
     <h3>🎯 Recomendación</h3>
     <ul style="margin:0;padding-left:18px;font-size:14px">${rec.map(r=>`<li style="margin-bottom:6px">${esc(r)}</li>`).join("")}</ul>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>
     <button class="btn btn-accent" onclick="cerrarLlamada('${c.id}')">He terminado</button>`);
  c.lastContact=todayISO();DB.save(db);
}

function saveContract(id,sector){
  const clientId=document.getElementById("f_client").value;
  const companyId=document.getElementById("f_company").value;
  if(!clientId||!companyId){toast("Cliente y empresa obligatorios");return}
  const company=companyById(companyId);
  const sectorData = {};
  const fields = document.querySelectorAll("[id^='sd_']");
  fields.forEach(f=>{
    const key = f.id.replace("sd_","");
    sectorData[key] = f.type==="number" ? +f.value : f.value;
  });
  const data = {
    userId:session.userId,clientId,sector,
    companyId,companyName:company?.name||"",
    startDate:document.getElementById("f_sdate").value,
    renewalDate:document.getElementById("f_rdate").value,
    commissionEstimated:+document.getElementById("f_ce").value||0,
    status:document.getElementById("f_status").value,
    notes:document.getElementById("f_notes").value.trim(),
    sectorData
  };
  if(id) Object.assign(db.contracts.find(x=>x.id===id),data);
  else db.contracts.push({id:uid(),...data});
  DB.save(db);closeModal();toast("Contrato guardado");navigate("contratos");
}
window.saveContract=saveContract;
function deleteContract(id){
  if(!confirm("¿Eliminar contrato?")) return;
  db.contracts=db.contracts.filter(c=>c.id!==id);

  db.commissions=db.commissions.filter(c=>c.contractId!==id);

}

function localCopilot(q){
  const ql=q.toLowerCase();
  if(ql.includes("hoy")){
    const ren=computeRenewals().filter(c=>c.daysToRenewal<=60).length;
    const tasks=myTasks().filter(t=>t.status!=="completada"&&t.date<=todayISO()).length;
    const com=myCommissions().filter(c=>c.status==="pendiente");
    return `📋 Hoy: ${ren} renovaciones, ${tasks} tareas, ${com.length} comisiones pendientes (${fmtMoney(com.reduce((a,b)=>a+b.amount,0))})`;
  }
  if(ql.includes("sector")){
    const contracts=myContracts();
    const bySector={};
    contracts.forEach(c=>{if(!bySector[c.sector])bySector[c.sector]=0;bySector[c.sector]++});
    let r="📊 Contratos por sector:\n";
    Object.entries(bySector).forEach(([s,n])=>{r+=`  ${SECTORS[s]?.icon} ${SECTORS[s]?.name}: ${n}\n`});
    return r;
  }
  if(ql.includes("dormido")){const d=dormantClients();return d.length?`😴 ${d.length} clientes dormidos`:"No tienes clientes dormidos."}
  if(ql.includes("cobrar")){const c=myCommissions().filter(x=>x.status==="pendiente");return c.length?`💰 ${fmtMoney(c.reduce((a,b)=>a+b.amount,0))} pendientes`:"Todo cobrado."}
  if(ql.includes("cruzada")){
    const clients=myClients();
    const contracts=myContracts();
    const opportunities=clients.filter(c=>{const cs=contracts.filter(co=>co.clientId===c.id);const sectors=[...new Set(cs.map(co=>co.sector))];return sectors.length<3}).length;
    return `🎯 ${opportunities} clientes con menos de 3 sectores → oportunidades de venta cruzada.`;
  }
  return "Puedo ayudarte con: qué tienes hoy, contratos por sector, clientes dormidos, comisiones pendientes, oportunidades de venta cruzada...";
}

function renderVoz(){
  const supported='webkitSpeechRecognition' in window||'SpeechRecognition' in window;
  const main=document.getElementById("mainContent");
  main.innerHTML=`<div class="page-title"><div><h2>🎙️ Asistente de voz</h2></div></div>${!supported?`<div class="alert-banner">⚠️ Navegador no compatible</div>`:""}<div class="card" style="text-align:center;padding:30px"><button id="bigMic" class="mic-btn" style="width:100px;height:100px;font-size:40px;margin:0 auto" ${supported?"":"disabled"}>️</button><div class="mt" id="voiceStatus" style="font-size:14px;color:var(--muted)">Pulsa para hablar</div><div class="mt2" id="voiceTranscript" style="background:#f9fafb;padding:14px;border-radius:10px;min-height:60px;text-align:left;font-size:14px"></div><div class="mt2" id="voiceParsed" style="background:#fffbeb;padding:14px;border-radius:10px;min-height:40px;text-align:left;font-size:13px;color:#92400e"></div><div class="mt2 row" style="justify-content:center"><button class="btn btn-secondary" onclick="confirmVoice()" id="btnConfirmVoice" disabled>✅ Crear tarea</button></div></div>`;
  if(!supported) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const rec=new SR();rec.lang="es-ES";
  const mic=document.getElementById("bigMic");
  if(mic) mic.onclick=()=>{try{rec.start()}catch(e){}mic.classList.add("recording")};
  rec.onresult=(e)=>{
    const finalText=e.results[0][0].transcript;
    const vt=document.getElementById("voiceTranscript");
    if(vt) vt.textContent=finalText;
    if(mic) mic.classList.remove("recording");
    const parsed=parseVoiceCommand(finalText);
    const vp=document.getElementById("voiceParsed");
    if(vp) vp.innerHTML=renderParsed(parsed);
    const btn=document.getElementById("btnConfirmVoice");
    if(btn) btn.disabled=!parsed.ok;
    window._parsedVoice=parsed;
  };
  rec.onend=()=>{if(mic) mic.classList.remove("recording")};
}
function parseVoiceCommand(text){
  const t=text.toLowerCase();
  const clients=myClients();
  let client=null;
  for(const c of clients){if(t.includes(c.name.toLowerCase())){client=c;break}}
  let type="SEGUIMIENTO";
  if(t.includes("factura")) type="PEDIR FACTURA";
  else if(t.includes("llamar")) type="LLAMAR";
  else if(t.includes("whatsapp")) type="WHATSAPP";
  let date=todayISO();
  if(t.includes("mañana")) date=addDays(todayISO(),1);
  return {ok:!!client,text,client,type,date};
}
function renderParsed(p){if(!p.ok) return "⚠️ No he identificado el cliente.";return `👤 ${esc(p.client.name)} · 🎯 ${esc(p.type)} · 📅 ${fmtDate(p.date)}`}
function confirmVoice(){const p=window._parsedVoice;if(!p||!p.ok) return;db.tasks.push({id:uid(),userId:session.userId,clientId:p.client.id,contractId:null,type:p.type,date:p.date,time:"",priority:"media",description:"Por voz: "+p.text,status:"pendiente"});DB.save(db);toast("Tarea creada");navigate("tareas")}

  const data={

    phone:document.getElementById("f_phone").value.trim(),

function nextInvoiceNumber(){
  const year=new Date().getFullYear();

  let max=0;thisYear.forEach(i=>{const n=parseInt(i.number.split("-")[1]);if(n>max) max=n});
  return `${year}-${String(max+1).padStart(3,"0")}`;
}

window.updateInvoiceTotals=function(){
  if(!window._invoiceItems) return;
  const base=window._invoiceItems.reduce((a,b)=>a+(b.subtotal||0),0);
  const taxTypeEl=document.getElementById("inv_taxtype");
  const taxRateEl=document.getElementById("inv_taxrate");
  const taxType=taxTypeEl?taxTypeEl.value:"iva";
  const rate=taxRateEl?+taxRateEl.value:21;
  const tax=base*rate/100;const total=base+tax;
  const el=(id,v)=>{const e=document.getElementById(id);if(e) e.textContent=v};
  el("inv_base",fmtMoney(base));el("inv_tax",fmtMoney(tax));el("inv_total",fmtMoney(total));el("inv_taxlabel",`${taxType.toUpperCase()} (${rate}%)`);
};
window.saveInvoice=function(id){
  const companyId=document.getElementById("inv_company").value;

  const items=window._invoiceItems.filter(it=>it.description&&it.subtotal>0);
  if(!items.length){toast("Añade al menos un concepto");return}
  const base=items.reduce((a,b)=>a+b.subtotal,0);
  const taxType=document.getElementById("inv_taxtype").value;
  const rate=+document.getElementById("inv_taxrate").value;
  const tax=base*rate/100;
  const data={userId:session.userId,companyId,number:document.getElementById("inv_number").value.trim(),date:document.getElementById("inv_date").value,dueDate:document.getElementById("inv_due").value,items,taxType,taxRate:rate,base,taxAmount:tax,total:base+tax,status:document.getElementById("inv_status").value,notes:document.getElementById("inv_notes").value.trim(),createdAt:nowISO()};
  const existing=myInvoices().find(i=>i.number===data.number&&i.id!==id);
  if(existing){toast("Ya existe una factura con ese número");return}
  if(id) Object.assign(db.invoices.find(x=>x.id===id),data);
  else db.invoices.push({id:uid(),...data});
  DB.save(db);closeModal();toast("Factura guardada");navigate("facturacion");
};

function saveUser(id){
  const data={
    name:document.getElementById("f_name").value.trim(),
    surname:document.getElementById("f_surname").value.trim(),
    email:document.getElementById("f_email").value.trim(),
    phone:document.getElementById("f_phone").value.trim(),
    username:document.getElementById("f_user").value.trim(),
    role:document.getElementById("f_role").value,
    status:document.getElementById("f_status").value
  };
  const pass=document.getElementById("f_pass").value;
  const provinceEl = document.getElementById("f_province");
  const province = provinceEl && provinceEl.offsetParent !== null ? provinceEl.value : null;
  if(!data.name||!data.username){toast("️ Nombre y usuario son obligatorios");return}
  const existingUser = db.users.find(u=>u.username===data.username && u.id!==id);
  if(existingUser){toast("⚠️ El nombre de usuario '"+data.username+"' ya existe");return}
  if(id){
    const u=db.users.find(x=>x.id===id);
    Object.assign(u,data);
    if(province!==null) u.province=province;
    if(pass) u.password=pass;
    DB.save(db);closeModal();toast("✅ Usuario '"+data.username+"' actualizado");navigate("admin");
  }
  else{
    if(!pass){toast("⚠️ La contraseña es obligatoria para nuevos usuarios");return}
    if(pass.length<4){toast("⚠️ La contraseña debe tener al menos 4 caracteres");return}
    const newUser = {id:uid(),...data,password:pass,createdAt:todayISO(),assignedSectors:Object.keys(SECTORS),province:province||null,territory:null,billing:{businessName:data.name+" "+(data.surname||""),taxId:"",address:"",email:data.email,phone:data.phone,iban:"",regime:"autonomo",defaultTax:"iva",logo:null}};
    db.users.push(newUser);
    DB.save(db);console.log("Usuario creado:", newUser);closeModal();toast("✅ Usuario '"+data.username+"' creado correctamente.");navigate("admin");
  }
}

function importData(e){const f=e.target.files[0];if(!f) return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.users) throw new Error("Formato inválido");if(!confirm("¿Reemplazar datos?")) return;DB.save(data);location.reload()}catch(err){toast("Error: "+err.message)}};r.readAsText(f)}
window.importData=importData;

const IMPORT_FIELDS=[{key:"name",label:"Nombre",required:true},{key:"surname",label:"Apellidos",required:false},{key:"phone",label:"Teléfono",required:false},{key:"email",label:"Email",required:false},{key:"address",label:"Dirección",required:false},{key:"city",label:"Ciudad",required:false},{key:"notes",label:"Notas",required:false}];
const COLUMN_ALIASES={name:["nombre","name","first name"],surname:["apellidos","surname","last name"],phone:["teléfono","telefono","tel","movil","móvil","mobile","phone"],email:["email","e-mail","correo","mail"],address:["dirección","direccion","address","domicilio"],city:["ciudad","city","poblacion","localidad"],notes:["notas","notes","observaciones"]};

function openImportWizard(){
  window._importData={raw:null,headers:[],rows:[],mapping:{},duplicates:[],valid:[],errors:[]};
  const body=`<div class="import-steps-nav"><div class="step active" id="step1nav">1. Subir archivo</div><div class="step" id="step2nav">2. Revisar</div><div class="step" id="step3nav">3. Importar</div></div>
    <div class="import-step active" id="step1"><div class="drop-zone" id="dropZone" onclick="document.getElementById('importFile').click()"><div class="ic"></div><div class="t">Arrastra tu archivo aquí o haz clic</div><div class="s">Formatos: .xlsx, .xls, .csv</div><input type="file" id="importFile" accept=".xlsx,.xls,.csv" style="display:none" /></div><div class="divider"></div><div class="row between"><div class="text-muted" style="font-size:13px">¿No tienes plantilla?</div><button class="btn btn-secondary btn-sm" onclick="downloadImportTemplate()">📥 Descargar plantilla</button></div><div id="fileInfo" class="mt hidden" style="background:#f0fdf4;padding:10px;border-radius:8px;font-size:13px"></div></div>
    <div class="import-step" id="step2"><h3 style="margin:0 0 8px">🔗 Mapeo de columnas</h3><div class="column-mapper" id="columnMapper"></div><div class="divider"></div><h3 style="margin:0 0 8px">👀 Vista previa</h3><div class="import-preview" id="importPreview"></div><div class="import-stats" id="importStats"></div></div>
    <div class="import-step" id="step3"><h3 style="margin:0 0 8px">⚙️ Opciones</h3><div class="form-group"><label>¿Qué hacer con duplicados?</label><select id="dupStrategy"><option value="skip" selected>Omitir (recomendado)</option><option value="overwrite">Sobrescribir</option><option value="create">Crear igualmente</option></select></div><div class="form-group"><label>Ciudad por defecto</label><input type="text" id="defaultCity" /></div><div class="divider"></div><div id="importSummary"></div></div>`;
  openModal("📥 Importar clientes",body,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" style="width:auto" id="importNextBtn" onclick="importNextStep()">Siguiente →</button>`);
  document.getElementById("importFile").addEventListener("change",(e)=>{const f=e.target.files[0];if(f) handleImportFile(f)});
  const dz=document.getElementById("dropZone");
  dz.addEventListener("dragover",(e)=>{e.preventDefault();dz.classList.add("drag")});
  dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));
  dz.addEventListener("drop",(e)=>{e.preventDefault();dz.classList.remove("drag");const f=e.dataTransfer.files[0];if(f) handleImportFile(f)});
}
window.openImportWizard=openImportWizard;

function handleImportFile(file){
  if(!window.XLSX){toast("⏳ Cargando librería...");setTimeout(()=>handleImportFile(file),500);return}
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=new Uint8Array(e.target.result);
      const wb=window.XLSX.read(data,{type:"array"});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const json=window.XLSX.utils.sheet_to_json(sheet,{defval:"",raw:false});
      if(!json.length){toast("Archivo vacío");return}
      const headers=Object.keys(json[0]);
      window._importData.raw=json;window._importData.headers=headers;window._importData.rows=json;
      window._importData.mapping=autoDetectColumns(headers);
      const info=document.getElementById("fileInfo");
      if(info){info.classList.remove("hidden");info.innerHTML=`✅ <b>${file.name}</b> · ${json.length} filas · ${headers.length} columnas`;}
      setTimeout(()=>importNextStep(),600);
    }catch(err){toast("Error: "+err.message)}
  };
  reader.readAsArrayBuffer(file);
}
function autoDetectColumns(headers){
  const mapping={};
  const headersLower=headers.map(h=>h.toString().toLowerCase().trim());
  IMPORT_FIELDS.forEach(field=>{
    const aliases=COLUMN_ALIASES[field.key];
    for(let i=0;i<headersLower.length;i++){
      const h=headersLower[i];
      if(aliases.some(a=>h===a||h.includes(a))){mapping[field.key]=headers[i];break}
    }
  });
  return mapping;
}
function renderStep2(){
  const d=window._importData;
  const mapper=document.getElementById("columnMapper");
  if(!mapper) return;
  mapper.innerHTML=IMPORT_FIELDS.map(f=>{
    const opts=[`<option value="">— Sin asignar —</option>`];
    d.headers.forEach(h=>{opts.push(`<option value="${esc(h)}" ${d.mapping[f.key]===h?"selected":""}>${esc(h)}</option>`)});
    return `<div class="cm-item"><label>${f.label} ${f.required?"*":""}</label><select onchange="window._importData.mapping['${f.key}']=this.value;recomputeImportPreview()">${opts.join("")}</select></div>`;
  }).join("");
  recomputeImportPreview();
}
function recomputeImportPreview(){
  const d=window._importData;const existing=myClients();
  d.valid=[];d.duplicates=[];d.errors=[];
  d.rows.forEach((row,idx)=>{
    const client={};
    IMPORT_FIELDS.forEach(f=>{const col=d.mapping[f.key];client[f.key]=col?(row[col]||"").toString().trim():""});
    const errors=[];
    if(!client.name) errors.push("Falta nombre");
    if(client.phone&&!/^[\d\s+()-]{6,20}$/.test(client.phone)) errors.push("Teléfono inválido");
    if(client.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(client.email)) errors.push("Email inválido");
    if(errors.length){d.errors.push({row:idx+2,client,errors});return}
    const dup=existing.find(c=>{if(client.phone&&c.phone&&c.phone.replace(/\s/g,"")===client.phone.replace(/\s/g,"")) return true;if(client.email&&c.email&&c.email.toLowerCase()===client.email.toLowerCase()) return true;return false});
    if(dup) d.duplicates.push({row:idx+2,client,existingId:dup.id,existingName:dup.name+" "+(dup.surname||"")});
    else d.valid.push({row:idx+2,client});
  });
  const stats=document.getElementById("importStats");
  if(stats) stats.innerHTML=`<div class="box ok"><div class="n">${d.valid.length}</div><div class="l">✅ Válidos</div></div><div class="box warn"><div class="n">${d.duplicates.length}</div><div class="l">⚠️ Duplicados</div></div><div class="box err"><div class="n">${d.errors.length}</div><div class="l">❌ Errores</div></div><div class="box info"><div class="n">${d.rows.length}</div><div class="l"> Total</div></div>`;
  const preview=document.getElementById("importPreview");
  if(!preview) return;
  const all=[...d.valid.slice(0,20).map(x=>({...x,status:"ok",label:"✅ Nuevo"})),...d.duplicates.slice(0,10).map(x=>({...x,status:"dup",label:"⚠️ Duplicado"})),...d.errors.slice(0,10).map(x=>({...x,status:"err",label:"❌ "+x.errors.join(", ")}))];
  preview.innerHTML=`<table><thead><tr><th>Fila</th><th>Estado</th><th>Nombre</th><th>Teléfono</th><th>Email</th></tr></thead><tbody>${all.map(x=>`<tr class="${x.status}"><td>${x.row}</td><td style="font-size:11px">${x.label}</td><td>${esc(x.client.name)} ${esc(x.client.surname||"")}</td><td>${esc(x.client.phone||"—")}</td><td>${esc(x.client.email||"—")}</td></tr>`).join("")}</tbody></table>`;
}
window.recomputeImportPreview=recomputeImportPreview;
function renderStep3(){
  const d=window._importData;const strategy=document.getElementById("dupStrategy")?.value||"skip";
  let toImport=d.valid.length;let dups=d.duplicates.length;
  if(strategy==="overwrite"||strategy==="create"){toImport+=d.duplicates.length;dups=0}
  const sum=document.getElementById("importSummary");
  if(sum) sum.innerHTML=`<div class="import-stats"><div class="box ok"><div class="n">${toImport}</div><div class="l">Se importarán</div></div><div class="box warn"><div class="n">${dups}</div><div class="l">Duplicados</div></div><div class="box err"><div class="n">${d.errors.length}</div><div class="l">Con errores</div></div><div class="box info"><div class="n">${d.rows.length}</div><div class="l">Total</div></div></div>`;
}
function importNextStep(){
  const s1=document.getElementById("step1");const s2=document.getElementById("step2");const s3=document.getElementById("step3");
  const n1=document.getElementById("step1nav");const n2=document.getElementById("step2nav");const n3=document.getElementById("step3nav");
  const btn=document.getElementById("importNextBtn");
  if(s1.classList.contains("active")){if(!window._importData.rows?.length){toast("⚠️ Sube un archivo");return}s1.classList.remove("active");s2.classList.add("active");n1.classList.remove("active");n1.classList.add("done");n2.classList.add("active");btn.textContent="Siguiente →";renderStep2()}
  else if(s2.classList.contains("active")){if(!window._importData.mapping.name){toast("⚠️ Asigna columna 'Nombre'");return}s2.classList.remove("active");s3.classList.add("active");n2.classList.remove("active");n2.classList.add("done");n3.classList.add("active");btn.textContent="✅ Importar ahora";btn.onclick=executeImport;renderStep3()}
}
window.importNextStep=importNextStep;
function executeImport(){
  const d=window._importData;const strategy=document.getElementById("dupStrategy").value;const defaultCity=document.getElementById("defaultCity").value.trim();
  let created=0,updated=0,skippedDup=0;
  d.valid.forEach(item=>{const c=item.client;if(defaultCity&&!c.city) c.city=defaultCity;db.clients.push({id:uid(),userId:session.userId,name:c.name,surname:c.surname||"",phone:c.phone||"",email:c.email||"",address:c.address||"",city:c.city||"",notes:c.notes||"",lastContact:todayISO(),createdAt:todayISO()});created++});
  d.duplicates.forEach(item=>{const c=item.client;if(strategy==="skip") skippedDup++;else if(strategy==="overwrite"){const ex=db.clients.find(x=>x.id===item.existingId);if(ex){if(c.name) ex.name=c.name;if(c.phone) ex.phone=c.phone;if(c.email) ex.email=c.email;updated++}}else if(strategy==="create"){db.clients.push({id:uid(),userId:session.userId,name:c.name,surname:c.surname||"",phone:c.phone||"",email:c.email||"",address:c.address||"",city:c.city||"",notes:"Importado (posible duplicado)",lastContact:todayISO(),createdAt:todayISO()});created++}});
  DB.save(db);
  let summary=`✅ <b>${created}</b> creados`;if(updated) summary+=` · 🔄 <b>${updated}</b> actualizados`;if(skippedDup) summary+=` · ⚠️ <b>${skippedDup}</b> omitidos`;if(d.errors.length) summary+=` · ❌ <b>${d.errors.length}</b> errores`;
  const body=`<div style="background:#f0fdf4;padding:20px;border-radius:12px;text-align:center;margin-bottom:12px"><div style="font-size:48px"></div><div style="font-size:16px;font-weight:600;margin-top:8px">Importación completada</div><div style="margin-top:8px;font-size:14px">${summary}</div></div>`;
  const mb=document.querySelector(".modal-body");
  const mf=document.querySelector(".modal-foot");
  if(mb) mb.innerHTML=body;
  if(mf) mf.innerHTML=`<button class="btn btn-primary" style="width:auto" onclick="closeModal();navigate('clientes')">Ver clientes</button>`;
}
window.executeImport=executeImport;
function downloadImportTemplate(){
  if(!window.XLSX){toast("⏳ Cargando...");return}
  const example=[{Nombre:"Juan",Apellidos:"Pérez",Teléfono:"600123456",Email:"juan@email.com",Dirección:"Calle Mayor 1",Ciudad:"Madrid",Notas:"Cliente referido"},{Nombre:"María",Apellidos:"López",Teléfono:"611222333",Email:"maria@email.com",Dirección:"Av. Constitución 5",Ciudad:"Valencia",Notas:""}];
  const ws=window.XLSX.utils.json_to_sheet(example);const wb=window.XLSX.utils.book_new();window.XLSX.utils.book_append_sheet(wb,ws,"Clientes");window.XLSX.writeFile(wb,"plantilla-clientes.xlsx");toast("Plantilla descargada");
}
window.downloadImportTemplate=downloadImportTemplate;
function openImportCompaniesWizard(){toast("📥 Importación de empresas: usa la misma interfaz que clientes (próximamente)")}
window.openImportCompaniesWizard=openImportCompaniesWizard;

function setupSearch(){
  const input=document.getElementById("globalSearch");const results=document.getElementById("searchResults");
  if(!input||!results) return;
  input.addEventListener("input",()=>{
    const q=input.value.trim().toLowerCase();
    if(!q){results.classList.add("hidden");return}
    const out=[];
    myClients().forEach(c=>{if((c.name+" "+c.surname+" "+(c.phone||"")+" "+(c.email||"")).toLowerCase().includes(q)) out.push({type:"Cliente",label:c.name+" "+(c.surname||""),sub:c.phone||"",id:c.id,nav:"client"})});
    myContracts().forEach(c=>{if((c.companyName+" "+(c.sectorData?.cups||"")).toLowerCase().includes(q)){const cl=clientById(c.clientId);out.push({type:"Contrato",label:cl?.name+" — "+c.companyName,sub:SECTORS[c.sector]?.name||"",id:c.id,nav:"contract"})}});
    db.companies.forEach(c=>{if(c.name.toLowerCase().includes(q)) out.push({type:"Empresa",label:c.name,sub:(c.sectors||[]).map(s=>SECTORS[s]?.icon).join(" "),id:c.id,nav:"company"})});
    results.innerHTML=out.slice(0,10).map(o=>`<div class="sr-item" onclick="goSearch('${o.nav}','${o.id}')"><span class="sr-tag">${o.type}</span><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(o.label)}</div><div style="font-size:12px;color:var(--muted)">${esc(o.sub)}</div></div></div>`).join("")||`<div class="sr-item"><div class="text-muted">Sin resultados</div></div>`;
    results.classList.remove("hidden");
  });
  document.addEventListener("click",(e)=>{if(!e.target.closest(".search-global")) results.classList.add("hidden")});
}
function goSearch(kind,id){
  document.getElementById("searchResults").classList.add("hidden");
  document.getElementById("globalSearch").value="";
  if(kind==="client") openClient(id);
  else if(kind==="contract") openContract(id);
  else if(kind==="company") openCompanyDetail(id);
}
window.goSearch=goSearch;

function showAlerts(){
  const ren=computeRenewals().filter(c=>c.daysToRenewal<=30);
  const com=myCommissions().filter(c=>c.status==="pendiente");
  const dorm=dormantClients().filter(c=>c.daysSinceContact>=180);
  const tasks=myTasks().filter(t=>t.status!=="completada"&&t.date<todayISO());
  let html="";
  ren.slice(0,3).forEach(c=>{const cl=clientById(c.clientId);const s=SECTORS[c.sector];html+=`<div class="list-item" onclick="closeModal();openContract('${c.id}')"><div class="li-main"><div class="li-title">${s?.icon} Renovación ${c.daysToRenewal}d</div><div class="li-sub">${esc(cl?.name||"")}</div></div></div>`});
  tasks.slice(0,3).forEach(t=>{const cl=clientById(t.clientId);html+=`<div class="list-item" onclick="closeModal();openTask('${t.id}')"><div class="li-main"><div class="li-title">⚠️ Tarea atrasada</div><div class="li-sub">${esc(cl?.name||"")}</div></div></div>`});
  com.slice(0,3).forEach(c=>{html+=`<div class="list-item" onclick="closeModal();navigate('comisiones')"><div class="li-main"><div class="li-title">💰 Comisión pendiente</div><div class="li-sub">${fmtMoney(c.amount)}</div></div></div>`});
  if(!html) html=`<div class="empty">✨ Sin alertas</div>`;
  openModal("🔔 Alertas",`<div class="list">${html}</div>`,`<button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>`);
}
window.showAlerts=showAlerts;
function emptyHTML(msg){return `<div class="empty"><div class="ic">📭</div>${esc(msg)}</div>`}

// CORRECCIÓN #10: boot con lógica de demo corregida
function boot(){
  if(session) showApp();
  else document.getElementById("loginScreen").style.display="flex";
  document.getElementById("loginForm").addEventListener("submit",(e)=>{
    e.preventDefault();
    const u=document.getElementById("loginUser").value.trim();
    const p=document.getElementById("loginPass").value;
    const r=login(u,p);
    const err=document.getElementById("loginError");
    if(!r.ok){err.textContent=r.error;err.classList.remove("hidden");return}
    err.classList.add("hidden");showApp();
  });
  document.getElementById("btnDemoAccess").addEventListener("click",()=>{
    if(!db.settings.demo) enableDemo(db);
    const demo=db.users.find(u=>u.username==="demo");
    if(!demo){toast("Error: usuario demo no encontrado");return}
    setSession({userId:demo.id,role:demo.role});session=getSession();showApp();
  });
  document.getElementById("btnEmergencyReset").addEventListener("click",()=>{
    if(!confirm("Esto borrará TODO y recreará admin/demo. ¿Continuar?")) return;
    DB.clear();db=initDB();enableDemo(db);toast("Reset. Usa admin/admin123 o demo/demo123");setTimeout(()=>location.reload(),800);
  });
  document.getElementById("btnAlertsTop").addEventListener("click",showAlerts);
  document.getElementById("btnMicTop").addEventListener("click",()=>navigate("voz"));
  setupSearch();
  // Solo activar demo si no hay usuarios reales y la demo no está activa
  if(db.users.filter(u=>!u.isDemo).length===0 && !db.settings.demo) enableDemo(db);
}

// CORRECCIÓN #3: showApp comprueba user.status === "activo"
function showApp(){
  if(!session || !session.userId){
    console.error("No hay sesión válida");
    clearSession();
    document.getElementById("loginScreen").style.display="flex";
    document.getElementById("app").classList.remove("active");
    return;
  }
  const user = db.users.find(x=>x.id===session.userId);
  if(!user || user.status !== "activo"){
    console.error("Usuario de sesión no encontrado o desactivado:", session.userId);
    toast("️ Usuario no encontrado o desactivado. Inicia sesión de nuevo.");
    clearSession();
    document.getElementById("loginScreen").style.display="flex";
    document.getElementById("app").classList.remove("active");
    return;
  }
  console.log("Mostrando app para usuario:", user.username, "Role:", user.role);
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").classList.add("active");
  renderSidebar();
  document.querySelectorAll(".bn-item").forEach(el=>{el.addEventListener("click",()=>navigate(el.dataset.nav))});
  navigate("hoy");
}

boot();
</script>
